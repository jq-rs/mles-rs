[package]
name = "mles"
version = "2.9.4"
authors = ["jq-rs"]
edition = "2024"
description = "Mles, a distributed publish-subscribe data server"
license = "MPL-2.0"
repository = "https://github.com/jq-rs/mles-rs"
documentation = "https://mles.io"
readme = "README.md"
categories = ["network-programming"]
keywords = ["protocol", "publish-subscribe", "websocket", "mles"]

[lib]
name = "mles"
path = "src/lib.rs"

[[bin]]
name = "mles"
path = "src/main.rs"

[dependencies]
tokio = { version="1.54", features = ["full"] }
tokio-stream = { version="0.1.19", features = ["net"] }
tokio-util = { version="0.7.20", features = ["compat"] }
tokio-rustls = "0.26"
rustls-acme = { version="0.15", default-features = false, features = ["tokio", "aws-lc-rs", "webpki-roots"] }
warp = { version = "0.4", features = ["websocket"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
simple_logger = "5"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
log = "0.4.35"
serde = { version = "1.0", features = ["derive"] }
async-compression = { version = "0.4.52", features = ["tokio", "brotli", "zstd"] }
serde_json = "1.0"
siphasher = "1.0.0"
mime_guess = "2"
lru = "0.19"
governor = "0.10"
httpdate = "1"

[profile.release]
lto = true
strip = true

[dev-dependencies]
warp = { version = "0.4", features = ["websocket", "test"] }
